name: GitHub Metrics

on:
  # Refresh daily at 00:17 UTC (07:17 WIB)
  schedule:
    - cron: "17 0 * * *"
  # Allow a manual run from the Actions tab
  workflow_dispatch:
  # Refresh when profile files are changed on the default branch
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/metrics.yml"
      - "README.md"

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MuhammadIkhsanAlFajri
          filename: github-metrics.svg

          # Dark theme
          template: classic
          config_theme: github_dark
          config_timezone: Asia/Jakarta

          # Keep the general profile overview compact
          base: header, activity, community, repositories

          # Contribution calendar (last six months)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Most-used programming languages
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used

          # GitHub achievements
          # plugin_achievements: yes
          # plugin_achievements_display: compact
